<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>最終幻想：共鳴 攻略助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 單一主題：致敬 FF 經典藍色選單視窗，水晶青為重點色、金色標示目標 */
:root{
  --bg:#0b1230; --win:#13235a; --win2:#0f1c49; --line:#c9d6ff; --ink:#eef2ff;
  --mute:#9fb0de; --accent:#6fe3ff; --gold:#ffd27a; --ok:#7be3a4; --warn:#ffb36b; --bad:#ff7d8c;
  --display:"Cinzel","Noto Serif TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 50% -200px,#1d2f7a 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font:15px/1.6 var(--body);padding:0 0 60px}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#0b1230f2,#0b1230d9);backdrop-filter:blur(6px);border-bottom:1px solid #ffffff1a;padding:10px 16px 0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:980px;margin:0 auto}
h1{font:700 18px/1.2 var(--display);letter-spacing:.06em;margin:0;flex:1;min-width:180px;text-wrap:balance}
h1 small .ver{font-size:10px;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 6px;margin-left:4px;letter-spacing:0}
h1 small{display:block;font:500 11px var(--body);color:var(--mute);letter-spacing:.1em}
.chap{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
select,input[type=number]{background:var(--win2);color:var(--ink);border:1px solid #c9d6ff66;border-radius:6px;padding:6px 8px;font:inherit;font-size:14px}
select:focus-visible,input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save{font-size:12px;color:var(--mute);white-space:nowrap;text-decoration:none;border:1px solid #ffffff26;border-radius:999px;padding:2px 10px}
.save.ok{color:var(--ok)}.save.err{color:var(--warn)}
nav{display:flex;gap:4px;max-width:980px;margin:8px auto 0;overflow-x:auto}
nav a{flex:1;text-align:center;padding:9px 10px;color:var(--mute);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav a[aria-current=true]{color:var(--ink);border-color:var(--accent)}
main{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:14px}
.win{background:linear-gradient(180deg,var(--win),var(--win2));border:2px solid var(--line);border-radius:10px;box-shadow:0 0 0 2px #0b1230,0 6px 20px #0006;padding:14px}
.win h2{margin:0 0 4px;font-size:17px}
.sub{color:var(--mute);font-size:13px}
.jp{color:var(--mute);font-size:11px;margin-left:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.r-def{color:#8fb8ff}.r-brk{color:#ffb36b}.r-atk{color:#ff8f9d}.r-heal{color:#7be3a4}.r-sup{color:#d7a6ff}.r-jam{color:#c0c0ff}
.charhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
.next{border-left:3px solid var(--gold);background:#ffd27a12;padding:8px 10px;border-radius:0 6px 6px 0;margin-top:10px}
.next b{color:var(--gold)}
ol.steps{margin:6px 0 0;padding-left:20px}
ol.steps li{margin:3px 0}
.bar{height:6px;background:#ffffff1a;border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid #ffffff14;vertical-align:top}
th{color:var(--mute);font-weight:500}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.over td{opacity:.45}
.tbl{overflow-x:auto}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent);font-size:13px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;margin-top:6px;font-size:13px}
label.ck{display:flex;gap:6px;align-items:flex-start;cursor:pointer}
label.ck input{margin-top:4px;accent-color:var(--accent)}
.auto{color:var(--ok)}
.eq{display:grid;gap:6px;margin-top:6px}
.eq div{display:grid;grid-template-columns:56px 1fr;gap:8px;font-size:13px}
.eq span:first-child{color:var(--mute)}
.stat{display:flex;gap:16px;flex-wrap:wrap}
.stat div{min-width:90px}
.stat b{display:block;font:700 22px var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.shard{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff10;font-size:14px;cursor:pointer}
.shard input{accent-color:var(--gold);margin-top:5px}
.shard.done{color:var(--mute);text-decoration:line-through}
.chhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.chhead h3{margin:0;font-size:15px;color:var(--gold)}
.reward{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px solid #ffffff10}
.reward.got{color:var(--ok)}
.reward.nextr{color:var(--gold);font-weight:700}
.locked{opacity:.6;border-style:dashed}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;margin:8px 0}
.kv dt{color:var(--mute)}.kv dd{margin:0}
ul.tips{margin:6px 0 0;padding-left:18px;font-size:14px}
.btn{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.note{font-size:12px;color:var(--mute)}
.qrbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
#modal:empty{display:none}
.ov{position:fixed;inset:0;z-index:20;background:#050a1fcc;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:linear-gradient(180deg,var(--win),var(--win2));border:2px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:88%;display:flex;flex-direction:column}
@media (min-width:640px){.ov{align-items:center}.sheet{border-radius:14px}}
.sheet header{position:static;background:none;backdrop-filter:none;padding:14px 16px 8px;border-bottom:1px solid #ffffff1a}
.sheet .list{overflow-y:auto;padding:4px 16px 8px;flex:1}
.sheet footer{padding:10px 16px;border-top:1px solid #ffffff1a;display:flex;gap:8px;justify-content:flex-end}
.vrow{padding:8px 0;border-bottom:1px solid #ffffff10}
.vrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.seg button{background:var(--win2);color:var(--mute);border:1px solid #c9d6ff40;border-radius:5px;padding:6px 0;font:inherit;font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer;min-height:32px}
.seg button.on{background:var(--accent);color:#0b1230;border-color:var(--accent);font-weight:700}
.seg button.lit{color:var(--ink);border-color:#6fe3ff80}
textarea{width:100%;min-height:90px;background:var(--win2);color:var(--ink);border:1px solid #c9d6ff66;border-radius:6px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace;word-break:break-all}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.solid{background:var(--accent);color:#0b1230;font-weight:700}
.msg{font-size:13px;margin-top:6px}.msg.ok{color:var(--ok)}.msg.err{color:var(--warn)}
.bt{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.bt td{border:1px solid #c9d6ff33;padding:6px 10px;width:50%}
.bt td.h{color:var(--mute);font-size:12px;background:#ffffff08}
.bt .w{color:var(--gold);font-weight:700}
.bt .u{color:var(--mute)}
.boss.done{opacity:.55}
figure.map{margin:10px 0 0}
figure.map img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid #c9d6ff40;background:#0f1c49}
figure.map figcaption{font-size:12px;color:var(--mute);margin-top:4px}
.num-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:999px;background:#ffd27a22;color:var(--gold);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.lockrow{opacity:.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  if(!window.claude || !window.claude.use){ localMode("未登入或在 claude.ai 以外開啟，進度存在此瀏覽器。"); return; }
  try{
    const db = await window.claude.use("db");
    const user = await window.claude.use("user");
    if(!db || !user){ localMode("未登入或沒有存檔權限，進度存在此瀏覽器。"); return; }
    const uid = await user.id();
    if(!uid){ localMode("未登入，進度存在此瀏覽器。"); return; }
    const ref = db.doc("data/users/" + uid + "/progress");
    setSave("讀取雲端…");
    const timer = setTimeout(()=>setSave("雲端連線中…先存此瀏覽器", "err"), 10000);
    const snap = await ref.get();
    clearTimeout(timer);
    dbRef = ref; cloudMode = true;
    if(snap.exists){
      const remote = normalize(snap.data());
      if(!S.t || (remote.t||0) >= (S.t||0)){ S = remote; saveLocal(); render(); }
      else { dirty = true; flush(); }
      if(dbRef) setSave("已雲端同步", "ok");
    } else {
      dirty = true; await flush();
    }
  }catch(e){ localMode("目前無法使用雲端存檔，進度存在此瀏覽器。"); }
}

function learned(c){
  const set = new Set(c.manual);
  for(const [v, m] of Object.entries(c.mr)){
    for(const [id, a] of Object.entries(AB)){ if(a.v === v && a.mr <= m) set.add(id); }
  }
  return set;
}
function autoLearned(c){
  const set = new Set();
  for(const [v, m] of Object.entries(c.mr)){ for(const [id, a] of Object.entries(AB)){ if(a.v === v && a.mr <= m) set.add(id); } }
  return set;
}
function apFromVisions(c){
  let n = 0; for(const m of Object.values(c.mr)){ if(m>=4) n+=8; if(m>=9) n+=8; } return n;
}

function renderChars(){
  const joined = CHARS.filter(c=>c.ch<=S.ch);
  const hidden = CHARS.length - joined.length;
  let h = `<section class="win"><h2>角色成長</h2><p class="sub" style="margin:2px 0 0">選擇每位角色<strong>目前裝備的幻兵</strong>與它的精通等級（MR 0–9）。換幻兵時舊的 MR 會記住，已學技能自動算進推薦。每隻幻兵練到 MR4、MR9 各給 AP 上限 +8（永久）。</p></section><div class="grid2">`;
  for(const ch of joined) h += renderChar(ch);
  h += `</div>`;

}

function renderChar(ch){
  const c = cs(ch.id);
  const avail = Object.entries(VISIONS).filter(([k,v])=>v.ch<=S.ch);
  const L = learned(c), A = autoLearned(c);
  const usedBy = {}; for(const o of CHARS){ if(o.id!==ch.id && o.ch<=S.ch && S.chars[o.id] && S.chars[o.id].eq) usedBy[S.chars[o.id].eq] = o.n; }
  const eqOpts = `<option value="">— 未裝備 —</option>` + avail.map(([k,v])=>`<option value="${k}" ${c.eq===k?"selected":""}>${v.n}（${v.role}）${usedBy[k]?`－${usedBy[k]}裝備中`:""}</option>`).join("");
  const clash = c.eq && usedBy[c.eq];
  const curMR = c.eq ? (c.mr[c.eq] ?? 0) : 0;
  const mrOpts = Array.from({length:10},(_,i)=>`<option value="${i}" ${curMR===i?"selected":""}>MR ${i}</option>`).join("");

  // 下一步
  const steps = ch.plan.map(([id, why])=>({id, why, a:AB[id]})).filter(s=>!L.has(s.id));
  const open = steps.filter(s=>VISIONS[s.a.v].ch<=S.ch);
  const later = steps.length - open.length;
  let nextHtml = "";
  if(open.length){
    const first = open[0];
    const fm = c.mr[first.a.v] ?? 0;
    let lead;
    if(c.eq && c.eq !== first.a.v){
      const curPending = open.find(s=>s.a.v===c.eq);
      lead = curPending
        ? `目前的 <b>${vName(c.eq)}</b> 還有「${curPending.a.n}」可拿（MR${curPending.a.mr}），但更優先的是換成 <b>${vName(first.a.v)}</b> 練到 MR${first.a.mr} 拿「${first.a.n}」。`
        : `<b>${vName(c.eq)}</b> 對這個角色已沒有關鍵技能${curMR<4?`，練到 MR4 拿 AP+8 後`:"，"}建議換成 <b>${vName(first.a.v)}</b>，練到 MR${first.a.mr} 拿「${first.a.n}」。`;
    } else {
      lead = `${c.eq?"繼續練":"裝上"} <b>${vName(first.a.v)}</b>，練到 <b>MR${first.a.mr}</b> 拿「${first.a.n}」（${first.why}）。`;
    }
    const pct = Math.min(100, Math.round(fm/first.a.mr*100));
    nextHtml = `<div class="next"><div>${lead}</div><div class="bar" aria-label="進度"><i style="width:${pct}%"></i></div><div class="note">${vName(first.a.v)} 目前 MR${fm} / 目標 MR${first.a.mr}</div>
      ${open.length>1?`<ol class="steps" start="2">${open.slice(1,4).map(s=>`<li>${vName(s.a.v)} MR${s.a.mr}：${s.a.n} <span class="note">— ${s.why}</span></li>`).join("")}</ol>`:""}
      ${later?`<div class="note">另有 ${later} 個目標的幻兵在之後章節取得。</div>`:""}</div>`;
  } else if(later){
    nextHtml = `<div class="next">本章能拿的核心技能都學會了。之後章節還有 ${later} 個目標，先刷 MRP 把常用幻兵推到 MR4 / MR9 拿 AP。</div>`;
  } else {
    nextHtml = `<div class="next">核心技能全數學會 接下來把各幻兵練到 MR9 拿滿 AP，挑戰競技場與十二武具。</div>`;
  }

  // 應裝備技能
  const cap = parseInt(c.ap,10);
  let total = 0;
  const eqMR = c.eq ? (c.mr[c.eq]||0) : 0;
  const own = c.eq ? Object.entries(AB).filter(([id,a])=>a.v===c.eq && a.mr<=eqMR).map(([id])=>id) : [];
  const ownSet = new Set(own);
  const ownHtml = own.length ? `<div class="next" style="border-left-color:var(--ok);background:#7be3a412;margin-top:0;margin-bottom:8px"><b style="color:var(--ok)">${vName(c.eq)} 自帶生效</b><span class="note">（裝備中，不用另外裝、不佔 AP）</span><div style="font-size:13px;margin-top:2px">${own.map(id=>AB[id].n).join("、")}</div></div>` : "";
  const slotCap = DEFAULT_SLOTS;
  let used = 0;
  const recIds = ch.pri.filter(id=>L.has(id) && !ownSet.has(id));
  const rows = recIds.map(id=>{
    const a = AB[id]; const cost = a.ap||0;
    let why = "";
    if(used >= slotCap) why = "欄位已滿";
    else if(cap && total+cost>cap) why = "AP 不足";
    else { total += cost; used++; }
    return `<tr class="${why?"over":""}"><td>${a.n}<span class="jp">${a.jp}</span><div class="note">${a.d}</div></td><td>${vName(a.v)}</td><td class="num">${a.ap??"?"}</td><td class="num">${why||total}</td></tr>`;
  }).join("");
  // MASTER 建議：同一隻 MR9 幻兵有 2 個以上推薦技能時
  const byV = {}; for(const id of recIds){ const v = AB[id].v; (byV[v] = byV[v]||[]).push(id); }
  const masterTips = Object.entries(byV).filter(([v,ids])=>ids.length>=2 && (c.mr[v]||0)>=9 && MASTER_AP[v]).map(([v,ids])=>{
    const sum = ids.reduce((t,id)=>t+(AB[id].ap||0),0);
    return `<li>${vName(v)} MR9：可改裝「${vName(v)} MASTER」，1 欄就包含 ${ids.map(id=>AB[id].n).join("、")} 等全部技能（${MASTER_AP[v]} AP，分開裝要 ${sum} AP、${ids.length} 欄）</li>`;
  }).join("");
  const equipHtml = ownHtml + (rows
    ? `<div class="tbl"><table><thead><tr><th>另外裝上（依優先）</th><th>來源</th><th class="num">AP</th><th class="num">累計</th></tr></thead><tbody>${rows}</tbody></table></div><p class="note">技能欄固定 ${slotCap} 欄，已用 ${Math.min(used,slotCap)}/${slotCap}。超出 AP 上限或欄位的技能會變淡。</p>${masterTips?`<ul class="tips" style="font-size:13px">${masterTips}</ul>`:""}`
    : `<p class="note">${own.length?"其他幻兵還沒有可以另外裝的核心精通，先照上面的目標練。":"還沒學到這個角色的核心精通，先照上面的目標練。"}</p>`);

  // 手動勾選
  const relevant = [...new Set([...ch.plan.map(p=>p[0]), ...ch.pri])].filter(id=>VISIONS[AB[id].v].ch<=S.ch);
  const checks = relevant.map(id=>{
    const a = AB[id]; const auto = A.has(id);
    return `<label class="ck"><input type="checkbox" data-act="manual" data-c="${ch.id}" data-a="${id}" ${L.has(id)?"checked":""} ${auto?"disabled":""}><span>${a.n}<span class="note"> ${vName(a.v)} MR${a.mr}</span>${auto?` <span class="auto">✓自動</span>`:""}</span></label>`;
  }).join("");
  const recorded = Object.entries(c.mr).filter(([k,m])=>m>0).map(([k,m])=>`${vName(k)} MR${m}`).join("、");

  // 裝備
  const stage = S.ch<=4 ? "前期" : S.ch<=7 ? "中期" : "後期";
  const gear = (GEAR[ch.id]||[]);
  const now = gear.filter(g=>g.c<=S.ch);
  const pick = slot => {
    const xs = now.filter(g=>g.slot===slot);
    const order = {"後期":3,"中期":2,"前期":1};
    return xs.sort((a,b)=>(order[b.s]-order[a.s])||(b.c-a.c)).slice(0, slot==="飾品"?2:1);
  };
  const gearRows = ["武器","防具","飾品"].flatMap(sl=>pick(sl).map(g=>`<div><span>${sl}</span><span><b>${g.n}</b><span class="jp">${g.jp}</span><br><span class="note">${g.d}｜${g.how}</span></span></div>`)).join("");
  const nextGear = gear.filter(g=>g.c>S.ch).length;
  const gearHtml = gearRows ? `<div class="eq">${gearRows}</div>` : `<p class="note">第 1–3 章以商店最新裝備為主即可，推薦裝備從第 4 章開始出現。</p>`;

  return `<article class="win">
    <div class="charhead"><h2>${ch.n}<span class="jp">${ch.jp}</span></h2><span class="pill ${ch.cls}">${ch.role}</span></div>
    <p class="sub" style="margin:2px 0 8px">${ch.sum}</p>
    <div class="qrbar"><button type="button" class="btn" data-qr="${ch.id}">快速登記幻兵等級</button><span class="note">${(()=>{const xs=Object.values(c.mr).filter(m=>m>0);return xs.length?`已登記 ${xs.length} 隻，MR9 ${xs.filter(m=>m>=9).length} 隻`:"還沒登記其他幻兵的 MR";})()}</span></div>
    <div class="row">
      <label class="field" for="eq-${ch.id}">裝備中的幻兵<select id="eq-${ch.id}" data-act="eq" data-c="${ch.id}">${eqOpts}</select></label>
      <label class="field" for="mr-${ch.id}">精通等級<select id="mr-${ch.id}" data-act="mr" data-c="${ch.id}" ${c.eq?"":"disabled"}>${mrOpts}</select></label>
      <label class="field" for="ap-${ch.id}">AP 上限（選填）<input type="number" min="0" max="999" id="ap-${ch.id}" data-act="ap" data-c="${ch.id}" value="${esc(c.ap||"")}" style="width:90px"></label>
    </div>
    ${clash?`<p class="note" style="margin:6px 0 0;color:var(--warn)">${vName(c.eq)} 也登記在${clash}身上；遊戲裡同一隻幻兵同時只能給一人裝，請確認其中一位。</p>`:""}
    ${apFromVisions(c)?`<p class="note" style="margin:6px 0 0">已從幻兵取得 AP 上限 +${apFromVisions(c)}</p>`:""}
    ${nextHtml}
    <h3 style="font-size:14px;margin:12px 0 4px">目前該裝的精通技能</h3>

function renderShards(){
  const got = new Set(S.shards);
  const n = got.size;
  const nextR = REWARDS.find(r=>r[0]>n);
  const visible = SHARDS.map((s,i)=>({s,i})).filter(x=>x.s[0]<=S.ch);
  const reachable = visible.length;
  const hiddenCh = [...new Set(SHARDS.filter(s=>s[0]>S.ch).map(s=>s[0]))];
  let h = `<section class="win"><h2>石板碎片</h2>
    <div class="stat"><div><b>${n}</b><span class="note">已收集 / 99</span></div><div><b>${reachable-[...got].filter(i=>SHARDS[i][0]<=S.ch).length}</b><span class="note">目前章節還沒拿</span></div>
    <div><b>${nextR?nextR[0]-n:0}</b><span class="note">${nextR?`再 ${nextR[0]-n} 片換「${nextR[1]}」`:"獎勵全部領完"}</span></div></div>
    <p class="note">碎片交給「忘卻之宮」（港都格蘭珀特附近）的謎之公主換寶箱。碎片不會錯過，通關後也能回收。</p>
    <div class="filter"><label class="ck"><input type="checkbox" id="hideDone" ${S.hideDone?"checked":""} data-act="hideDone"> 隱藏已收集</label></div></section>`;
  h += `<div class="grid2"><section class="win"><h2>收集清單</h2>`;
  let curCh = 0, curArea = "";
  for(const {s,i} of visible){
    const done = got.has(i);
    if(S.hideDone && done) continue;
    if(s[0]!==curCh){ curCh=s[0]; const tot=SHARDS.filter(x=>x[0]===curCh).length; const g=SHARDS.map((x,j)=>j).filter(j=>SHARDS[j][0]===curCh&&got.has(j)).length; h+=`<div class="chhead"><h3>${CH_LABEL(curCh)}</h3><span class="note">${g}/${tot}</span></div>`; curArea=""; }
    h += `<label class="shard ${done?"done":""}"><input type="checkbox" data-act="shard" data-i="${i}" ${done?"checked":""}><span><b>${s[1]}</b>　${s[2]}</span></label>`;
  }
  if(hiddenCh.length) h += `<p class="note" style="margin-top:10px">之後章節（${hiddenCh.map(CH_LABEL).join("、")}）還有 ${SHARDS.length-reachable} 片，推進後會顯示。</p>`;
  h += `</section><section class="win"><h2>忘卻之宮獎勵</h2>`;
  for(const r of REWARDS){
    const cls = n>=r[0] ? "got" : (nextR && r[0]===nextR[0] ? "nextr" : "");
    h += `<div class="reward ${cls}"><span>${n>=r[0]?"✓ ":""}${r[1]} <span class="note">${r[2]}</span></span><span class="num">${r[0]} 片</span></div>`;
  }
  h += `<p class="note">80、89 片的「精金」可請艾琳打造角色最強武器（共需 8 個精金，其餘來自競技場等）。</p></section></div>`;
  return h;
}

function renderQuests(){
  const done = new Set(S.quests), f = S.qf;
  const avail = QUESTS.map((q,i)=>({q,i})).filter(x=>x.q[2]<=S.ch);
  const hidden = QUESTS.length - avail.length;
  const nDone = avail.filter(x=>done.has(x.i)).length;
  const keyLeft = avail.filter(x=>x.q[6] && !done.has(x.i));
  let h = `<section class="win"><h2>支線任務</h2>
    <div class="stat"><div><b>${nDone}</b><span class="note">已完成 / ${avail.length}</span></div><div><b>${keyLeft.length}</b><span class="note">還沒拿的幻兵／幻獸</span></div></div>
    ${keyLeft.length?`<div class="next">優先做：${keyLeft.map(x=>`<b>${esc(x.q[1])}</b>（${esc(x.q[5].split("、")[0])}）`).join("、")}</div>`:""}
    <div class="filter">
      <label class="ck"><input type="checkbox" id="qf-key" data-act="qf" data-f="key" ${f.key?"checked":""}> 只看給幻兵／幻獸的</label>
      <label class="ck"><input type="checkbox" id="qf-hide" data-act="qf" data-f="hide" ${f.hide?"checked":""}> 隱藏已完成</label>
    </div>
    <p class="note">依目前進度顯示${hidden?`，之後章節還有 ${hidden} 個（防劇透隱藏）`:""}。中文任務名為暫譯，括號內為日文原名。</p></section>
  <section class="win">`;
  let cur = 0, shown = 0;
  for(const {q,i} of avail){
    const [jp,zh,ch,loc,cond,rew,flag] = q;
    const d = done.has(i);
    if(f.key && !flag) continue;
    if(f.hide && d) continue;
    if(ch!==cur){ cur=ch; const tot=avail.filter(x=>x.q[2]===ch).length; const g=avail.filter(x=>x.q[2]===ch&&done.has(x.i)).length; h+=`<div class="chhead"><h3>${CH_LABEL(ch)}</h3><span class="note">${g}/${tot}</span></div>`; }
    shown++;
    const tag = flag==="v" ? `<span class="pill r-heal">幻兵</span> ` : flag==="s" ? `<span class="pill r-sup">幻獸</span> ` : "";
    h += `<label class="shard ${d?"done":""}"><input type="checkbox" data-act="quest" data-i="${i}" ${d?"checked":""}><span>${tag}<b>${esc(zh)}</b><span class="jp">${esc(jp)}</span><br>
      <span class="note">${esc(loc)}｜${esc(cond)}</span><br><span style="font-size:13px">報酬：${esc(rew)}</span></span></label>`;
  }
  if(!shown) h += `<p class="note">沒有符合條件的支線。</p>`;
  return h + `</section>`;
}

function exportCode(){
  const o = JSON.parse(JSON.stringify(S));
  return "FFRS1:" + btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function parseCode(txt){
  const t = String(txt||"").trim().replace(/\s+/g,"");
  if(!t.startsWith("FFRS1:")) throw new Error("進度碼應以 FFRS1: 開頭，請確認有完整複製。");
  let o; try{ o = JSON.parse(decodeURIComponent(escape(atob(t.slice(6))))); }catch(e){ throw new Error("進度碼不完整或已損壞，請重新複製一次。"); }
  if(!o || typeof o !== "object" || typeof o.ch !== "number") throw new Error("這不是本攻略頁的進度碼。");
  return normalize(o);
}

function renderBuilds(){
  const tag = S.buildTag || "全部";
  const avail = BUILDS.filter(b=>b.ch<=S.ch);
  const hidden = BUILDS.length - avail.length;
  const list = avail.filter(b=>tag==="全部" || b.tag.includes(tag));
  const chips = BUILD_TAGS.map(t=>`<button type="button" class="btn ${t===tag?"solid":""}" data-click="btag" data-t="${t}" aria-pressed="${t===tag}">${t}</button>`).join("");
  let h = `<section class="win"><h2>流派</h2>
    <p class="sub" style="margin:2px 0 0">整理網路上常見的隊伍組合。每個成員會對照你在「角色成長」登記的精通，顯示還差哪些技能。幻兵 MR 是每個角色分開算的；同一隻幻兵同時只能給一個角色裝，所以每個流派裡的裝備幻兵都不重複。</p>
    <div class="filter" role="group" aria-label="依類型篩選">${chips}</div></section>`;
  if(!list.length) h += `<p class="note">這個類型目前章節還沒有可用的流派。</p>`;
  for(const b of list) h += renderBuild(b);
  if(hidden) h += `<p class="note">還有 ${hidden} 個流派要到之後章節才組得出來（防劇透隱藏）。</p>`;
  return h;
}

function renderBuild(b){
  let have = 0, need = 0;
  const memHtml = b.mem.map(m=>{
    const ch = CHARS.find(x=>x.id===m.c);
    const joined = ch && ch.ch<=S.ch;
    if(!ch) return "";
    const c = cs(m.c); const L = learned(c);
    const reqs = {};
    for(const id of m.ab){ const a = AB[id]; if(!a) continue; reqs[a.v] = Math.max(reqs[a.v]||0, a.mr); }
    const abList = m.ab.filter(id=>AB[id]).map(id=>{
      const a = AB[id]; const ok = L.has(id); const locked = VISIONS[a.v].ch>S.ch;
      if(!m.opt || joined){ need++; if(ok) have++; }
      return `<li class="${ok?"auto":""}">${ok?"✓":"・"} ${a.n}<span class="note"> ${locked?"之後章節的幻兵":`${vName(a.v)} MR${a.mr}`}${a.ap!=null?`｜AP ${a.ap}`:""}</span></li>`;
    }).join("");
    const reqLine = Object.entries(reqs).sort((x,y)=>y[1]-x[1]).map(([v,mr])=>{
      const cur = c.mr[v]||0; const locked = VISIONS[v].ch>S.ch;
      return `<span class="pill" style="${cur>=mr?"color:var(--ok)":locked?"color:var(--mute)":""}">${locked?"？？？":vName(v)} MR${mr}${cur>=mr?" ✓":cur?`（目前 ${cur}）`:""}</span>`;
    }).join(" ");
    const vEq = VISIONS[m.v] && VISIONS[m.v].ch<=S.ch ? vName(m.v) : "之後章節的幻兵";
    return `<div class="win" style="padding:10px;border-width:1px;box-shadow:none;margin-top:8px;${joined?"":"opacity:.55"}">
      <div class="charhead"><b>${ch.n}<span class="jp">${m.role}</span></b><span class="note">裝備幻兵：${vEq}</span></div>
      ${m.vnote?`<div class="note">${esc(m.vnote)}</div>`:""}${m.opt?`<div class="note">${esc(m.opt)}</div>`:""}${!joined?`<div class="note">此角色之後章節加入</div>`:""}
      <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">${reqLine}</div>
      <ul class="tips" style="list-style:none;padding-left:0;margin-top:6px">${abList}</ul>
      ${m.aw?`<div class="note" style="color:var(--gold)">覺醒：${esc(m.aw)}</div>`:""}
      <div class="note">裝備：${esc(m.gear)}</div></div>`;
  }).join("");
  const pct = need ? Math.round(have/need*100) : 0;
  const tags = b.tag.map(t=>`<span class="pill r-sup">${t}</span>`).join(" ");
  return `<article class="win">
    <div class="charhead"><h2>${b.name}${b.hot?` <span class="pill" style="color:var(--gold)">主流</span>`:""}</h2><span>${b.id==="farm"?`<button type="button" class="btn solid" data-click="farminfo" aria-haspopup="dialog">詳細說明</button> `:""}${tags}</span></div>
    <p class="note" style="margin:2px 0 6px">${CH_LABEL(b.ch)}起可組成｜你的完成度 ${have}/${need}（${pct}%）</p>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p style="margin:10px 0 4px">${b.feat}</p>
    <h3 style="font-size:14px;margin:10px 0 2px">玩法</h3><ol class="steps">${b.play.map(x=>`<li>${x}</li>`).join("")}</ol>
    <dl class="kv"><dt style="color:var(--ok)">優點</dt><dd>${b.pros}</dd><dt style="color:var(--warn)">缺點</dt><dd>${b.cons}</dd></dl>
    <details><summary>成員、所需幻兵與裝備</summary>${memHtml}</details>
    ${b.tips&&b.tips.length?`<h3 style="font-size:14px;margin:10px 0 2px">小技巧</h3><ul class="tips">${b.tips.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
  </article>`;
}

  const gil = n => n.toLocaleString("en-US");
  const bought = new Set(S.ship), got = new Set(S.tr);
  const early = S.ch < 6;
  const shipRows = SHIP.map((x,i)=>{
    const lock = x.c > S.ch, d = bought.has(i);
    return `<tr class="${lock?"lockrow":""}"><td><span class="num-badge">${CIRCLED[i]}</span></td>
      <td>${lock?`<b>？？？</b><div class="note">${CH_LABEL(x.c)}後出現（防劇透）</div>`:`<b>${x.n}</b><span class="jp">${x.jp}</span><div class="note">${esc(x.use)}</div><div class="note">出現時機：${esc(x.when)}</div>`}</td>

  const radarRows = RADAR.map(r=>{

    return `<tr class="${lock?"lockrow":""}"><td><b>${lock?"？？？":r.n}</b>${lock?"":`<span class="jp">${r.jp}</span>`}</td><td>${r.range}</td><td>${lock?`${CH_LABEL(r.c)}後取得`:esc(r.how)}</td></tr>`;
  }).join("");
  const nGot = TREASURE.filter((t,i)=>got.has(i)).length;
  const nextIdx = TREASURE.findIndex((t,i)=>!got.has(i));
  let cur = 0;
  const trList = TREASURE.map((t,i)=>{
    const lock = t[2] > S.ch, d = got.has(i);
    let head = "";
    if(t[2]!==cur){ cur=t[2]; const r = RADAR.find(x=>x.c===cur); head = `<div class="chhead"><h3>${r.range}　需要「${t[2]>S.ch?"？？？":r.n}」</h3><span class="note">${CH_LABEL(cur)}</span></div>`; }

  return `<section class="win"><h2>飛空艇攻略</h2>
    <p class="sub" style="margin:2px 0 0">第 6 章起，用飛空艇可以逛<b>海上商船</b>、用<b>密西迪亞雷達</b>找<b>隱藏寶物</b>。兩邊互相關聯：商船賣的「高輸出發電機」是雷達第 3 階段的素材。</p>

    ${early?`<div class="next">目前在${CH_LABEL(S.ch)}，商船與隱藏寶物要到<b>第 6 章</b>才開放。先存 Gil：五樣商品全買共 230,000 Gil。</div>`:""}
  </section>

  <section class="win"><h2>海上商船</h2>
    <p class="note" style="margin:0">在世界各地海上移動的商店，要搭飛空艇才能用。</p>
    <ul class="tips">
      <li>商船沿著固定路線在海上繞圈。開飛空艇沿下圖的巡迴路線飛，看到船影就靠近，碰到船後對話即可打開商店。</li>
      <li>主線推進到特定條件時，<b>出現路線和販售商品都會換</b>；每進入新階段，記得回去路線上找。</li>
      <li>每樣都很貴，先存好 Gil 優先買（刷錢可看「流派」分頁的刷練說明）。</li>
    </ul>

function renderVisions(){
  const avail = Object.entries(VISIONS).filter(([k,v])=>v.ch<=S.ch);
  const hidden = Object.keys(VISIONS).length - avail.length;
  let h = `<section class="win"><h2>幻兵一覽</h2><p class="note">目前可取得 ${avail.length} 隻${hidden?`，之後章節還有 ${hidden} 隻`:""}。精通技能學會後，換別的幻兵也能繼續裝備；MR 依角色分開計算。困難難度 MRP ×1.5。</p></section>
  <section class="win"><div class="tbl"><table><thead><tr><th>幻兵</th><th>定位</th><th>取得</th><th>關鍵精通</th></tr></thead><tbody>`;
  const roleCls = {"防禦":"r-def","破防":"r-brk","攻擊":"r-atk","治療":"r-heal","干擾":"r-jam"};
  for(const [k,v] of avail){
    const st = S.aw[k]||0;
    h += `<tr><td><b>${v.n}</b>${st?` <span style="color:var(--gold)">${"★".repeat(st)}</span>`:""}<span class="jp">${v.jp}</span><div class="note">${v.el}</div></td><td><span class="pill ${roleCls[v.role]||""}">${v.role}</span><div class="note">${CH_LABEL(v.ch)}</div></td><td>${v.get}</td><td>${(VISION_KEY[k]||[]).join("<br>")}</td></tr>`;
  }
  return h + `</tbody></table></div></section>`;
}

/* ============ 事件 ============ */
document.getElementById("chapSel").addEventListener("change", e=>{ S.ch = parseInt(e.target.value,10); change(); render(); });
root.addEventListener("change", e=>{
  const t = e.target, act = t.dataset.act; if(!act) return;
  if(act==="eq"){ const c = cs(t.dataset.c); c.eq = t.value; if(c.eq && c.mr[c.eq]==null) c.mr[c.eq] = 0; }
  else if(act==="mr"){ const c = cs(t.dataset.c); if(c.eq) c.mr[c.eq] = parseInt(t.value,10); }
  else if(act==="ap"){ const c = cs(t.dataset.c); c.ap = t.value; }
  else if(act==="slots"){ const c = cs(t.dataset.c); c.slots = t.value; }
  else if(act==="manual"){ const c = cs(t.dataset.c); const id = t.dataset.a; c.manual = c.manual.filter(x=>x!==id); if(t.checked) c.manual.push(id); }
  else if(act==="shard"){ const i = +t.dataset.i; S.shards = S.shards.filter(x=>x!==i); if(t.checked) S.shards.push(i); }
  else if(act==="summon"){ const id = t.dataset.s; S.summons = S.summons.filter(x=>x!==id); if(t.checked) S.summons.push(id); }
  else if(act==="hideDone"){ S.hideDone = t.checked; }
  else if(act==="mat"){ S.mats[t.dataset.m] = Math.max(0, parseInt(t.value,10)||0); }
  else if(act==="aw"){ S.aw[t.dataset.v] = parseInt(t.value,10); }
  else if(act==="boss"){ const k = t.dataset.k; S.bosses = S.bosses.filter(x=>x!==k); if(t.checked) S.bosses.push(k); }
  else if(act==="quest"){ const k = +t.dataset.i; S.quests = S.quests.filter(x=>x!==k); if(t.checked) S.quests.push(k); }
  else if(act==="ship"){ const k = +t.dataset.i; S.ship = S.ship.filter(x=>x!==k); if(t.checked) S.ship.push(k); }
  else if(act==="tr"){ const k = +t.dataset.i; S.tr = S.tr.filter(x=>x!==k); if(t.checked) S.tr.push(k); }
  else if(act==="qf"){ S.qf[t.dataset.f] = t.checked; }
  else if(act==="bf"){ const f = t.dataset.f; S.bf[f] = f==="hide" ? t.checked : t.value; }
  else if(act==="cave"){ const k = t.dataset.k; S.caves = S.caves.filter(x=>x!==k); if(t.checked) S.caves.push(k); }
  change();
  const y = window.scrollY; const fid = t.id; render(); window.scrollTo(0,y);
  if(fid){ const el = document.getElementById(fid); if(el) el.focus({preventScroll:true}); }
});
root.addEventListener("click", e=>{ const q = e.target.closest("[data-qr]"); if(q){ qrChar = q.dataset.qr; renderQR(); } });
root.addEventListener("click", async e=>{
  const b = e.target.closest("[data-click]"); if(!b) return;
  const act = b.dataset.click;
  if(act==="farminfo"){ infoOpen = true; renderInfo(); return; }
  if(act==="copy"){
    const box = document.getElementById("exportBox");
    try{ await navigator.clipboard.writeText(box.value); dataMsg = ["ok","已複製進度碼。"]; }
    catch(err){ dataMsg = ["err","無法自動複製，已幫你選取文字，請手動複製。"]; }
    render();
    if(dataMsg[0]==="err"){ const bx=document.getElementById("exportBox"); if(bx){ bx.focus(); bx.select(); } }
    return;
  }
  if(act==="import"){
    try{ const n = parseCode(document.getElementById("importBox").value); S = n; change(); dataMsg = ["ok", `匯入完成：${CH_LABEL(S.ch)}、碎片 ${S.shards.length} 片。`]; }
    catch(err){ dataMsg = ["err", err.message]; }
  }
  else if(act==="awall"){ const n = +b.dataset.n; for(const [k,v] of Object.entries(VISIONS)) if(v.ch<=S.ch) S.aw[k] = n; change(); }
  else if(act==="btag"){ S.buildTag = b.dataset.t; change(); }
  else if(act==="reset"){ resetArmed = true; dataMsg = null; }
  else if(act==="reset-no"){ resetArmed = false; }
  else if(act==="reset-yes"){ resetArmed = false; S = normalize({}); change(); dataMsg = ["ok","進度已清空。"]; }
  else return;
  render();
});
window.addEventListener("hashchange", ()=>{ dataMsg = null; resetArmed = false; render(); window.scrollTo(0,0); });

/* ============ 啟動 ============ */
const local = loadLocal(); if(local) S = normalize(local);
render();
initCloud();
</script>
